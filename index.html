<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>세종: 왕의 선택 v1.2.0</title><style>
:root{color-scheme:dark;--gold:#dfc48b;--cream:#f2ead9;--muted:#b6c5b9}*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 60% 0,#28423a,#101d1b 65%);color:var(--cream);font-family:system-ui,'Noto Sans KR',sans-serif}header{border-bottom:1px solid #50665b;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:10px}.brand{font-family:serif;font-size:26px;color:var(--gold)}.version{font-size:12px;color:var(--muted)}main{max-width:1100px;margin:35px auto;padding:0 20px;display:grid;grid-template-columns:minmax(0,1.7fr) minmax(260px,1fr);gap:20px}.panel{border:1px solid #5c685c;border-radius:16px;background:#192c27;padding:27px;box-shadow:0 12px 40px #0003}.eyebrow{color:var(--gold);letter-spacing:.15em;font-size:13px}h1{font-family:serif;font-size:33px;margin:14px 0 20px}p{line-height:1.9}.choices{display:grid;gap:11px;margin-top:28px}button{cursor:pointer;text-align:left;border:1px solid #7a806d;border-radius:11px;padding:16px;background:#253b32;color:var(--cream);font-size:15px;line-height:1.5}button:hover,button:focus{border-color:var(--gold);background:#344b3d}a{color:var(--gold)}.note{color:var(--muted);font-size:13px}.result{border-left:3px solid var(--gold);padding-left:14px;margin:20px 0}.tag{display:inline-block;border:1px solid #7a806d;border-radius:30px;padding:5px 10px;font-size:12px;color:var(--gold)}.hidden{display:none}#history{max-height:260px;overflow:auto;font-size:13px;color:var(--muted)}@media(max-width:760px){main{grid-template-columns:1fr;margin:16px auto}.panel{padding:20px}header{padding:15px 20px}h1{font-size:27px}}
</style></head><body><header><div><div class="brand">世宗 · 세종: 왕의 선택</div><div class="version">실록 기반 역사 결정 시뮬레이터 · v1.2.0</div></div><button onclick="restart()">처음부터</button></header><main><section class="panel"><div class="eyebrow" id="date"></div><h1 id="title"></h1><p id="story"></p><div class="choices" id="choices"></div><div id="feedback" class="result hidden"></div></section><aside class="panel"><div class="eyebrow">사료와 용어</div><h2>기록의 근거</h2><p id="source"></p><a id="link" target="_blank" rel="noopener">실록 기사 원문·국역 보기</a><h2>용어 풀이</h2><p id="terms"></p><p class="note">실제 기록의 결정과 다른 선택지는 역사적 사실이 아닌 가상 대안입니다. 후속 가상 장면은 별도로 표시합니다.</p><hr style="border-color:#50665b"><h2>선택 기록</h2><div id="history"></div><p class="note">검사 중 점수는 표시하지 않고 종료 후 공개합니다.</p></aside></main><script>
const EVENTS=[{"id":"birth","year":"1397","title":"한양에서 태어난 왕자","body":"1397년 태종 이방원과 원경왕후 민씨의 셋째 아들 이도가 태어났다. 왕위 계승이 예정된 아이는 아니었다. 이 장면은 생애 기록을 바탕으로 한 시작 장면이며 선택 점수는 매기지 않는다.","choices":[{"text":"다음 시기로 넘어간다.","real":true}],"source":"https://encykorea.aks.ac.kr/Article/E0029857","terms":"충녕대군: 세종이 즉위 전에 사용한 대군 칭호. 원경왕후: 세종의 어머니."},{"id":"prince","year":"1408","title":"충녕군에 봉해지다","body":"1408년 이도는 충녕군에 봉해졌고, 1412년 충녕대군으로 진봉되었다. 왕자의 지위는 높아졌으나 세자는 형 양녕대군이었다.","choices":[{"text":"충녕군에서 충녕대군으로 진봉된 역사적 경과를 따른다.","real":true},{"text":"처음부터 세자로 책봉된 것으로 처리한다.","real":false}],"source":"https://encykorea.aks.ac.kr/Article/E0029857","terms":"진봉: 봉작이나 지위를 높임. 세자: 왕위를 이을 후계자."},{"id":"heir","year":"1418","title":"왕세자로 책봉되다","body":"1418년 6월 충녕대군이 왕세자로 책봉되었다. 이어 8월 태종이 왕위를 넘겨 세종이 즉위하였다.","choices":[{"text":"왕세자 책봉을 거쳐 8월에 즉위한다.","real":true},{"text":"세자 책봉 없이 바로 왕위에 오른다.","real":false},{"text":"왕위 계승을 포기한다.","real":false}],"source":"https://encykorea.aks.ac.kr/Article/E0029857","terms":"양위: 왕이 살아 있을 때 왕위를 물려줌. 책봉: 지위를 공식적으로 정함."},{"id":"tsushima","year":"1419","title":"대마도 문제를 논하다","body":"세종 1년 조선은 왜구 문제에 대응해 대마도에 군사를 보냈다. 이종무가 지휘한 정벌은 이후 교역과 외교의 조정으로 이어졌다.","choices":[{"text":"이종무를 보내 대마도 정벌을 추진한다.","real":true},{"text":"정벌을 하지 않고 교역만 제안한다.","real":false},{"text":"대마도와의 왕래를 영구히 중단한다.","real":false}],"source":"https://encykorea.aks.ac.kr/Article/E0029857","terms":"왜구: 해안 지역을 침입한 해상 세력. 대마도: 일본과 한반도 사이의 섬."},{"id":"e0","year":"1420","title":"집현전의 관제를 정하다","body":"집현전의 관원을 두고 직책과 품계를 정하였다. 영전사·대제학·제학은 겸직하게 하고, 부제학 이하에는 녹관을 두어 경연관을 겸하게 하였다.","choices":[{"text":"집현전의 관제와 관원 수를 정하고 경연 직무를 겸하게 한다.","real":true},{"text":"기존 관청에 맡기고 별도의 직제를 두지 않는다.","real":false},{"text":"학문 기관을 두되 경연 직무는 분리한다.","real":false}],"source":"https://sillok.history.go.kr/id/kda_10203016_001","terms":"집현전: 학문 연구와 왕의 자문을 맡은 관청. 경연: 왕과 신하가 경서를 강론하는 자리."},{"id":"e1","year":"1430","title":"전세 제도의 폐단을 아뢰다","body":"호조가 답험의 폐단을 아뢰었다. 논밭의 수확을 조사하는 과정에서 관리가 사사로운 정에 끌리거나 아전이 문서를 바꾸어 백성을 괴롭히는 일이 있었다.","choices":[{"text":"공법에 대한 찬반을 관리뿐 아니라 각 지방의 백성에게도 묻도록 한다.","real":true},{"text":"호조의 제안대로 즉시 공법을 시행한다.","real":false},{"text":"기존 답험법을 그대로 두고 관리만 문책한다.","real":false}],"source":"https://sillok.history.go.kr/id/kda_11203005_004","terms":"공법: 토지 면적 등을 기준으로 전세를 정하는 제도. 답험: 작황을 직접 조사하는 일."},{"id":"e2","year":"1430","title":"공법을 두고 여러 지방이 반대하다","body":"호조 판서 안순이 각 도의 의견을 아뢰었다. 경상도에서는 찬성자가 많았으나 함길·평안·황해·강원도에서는 반대가 있었다. 임금은 백성이 원치 않는다면 곧바로 시행할 수 없다고 하였다.","choices":[{"text":"각 도의 보고를 더 받고 백관에게 공법과 답험의 폐단을 함께 의논하게 한다.","real":true},{"text":"찬성이 많은 지역부터 즉시 시행한다.","real":false},{"text":"반대가 있으니 논의를 모두 중단한다.","real":false}],"source":"https://sillok.history.go.kr/id/kda_11207005_001","terms":"호조: 국가 재정과 조세를 맡은 관청. 백관: 여러 관직의 신하들."},{"id":"e3","year":"1430","title":"공법 논의를 다시 모으다","body":"호조가 서울과 지방에서 모은 공법의 가부 의견을 갖추어 아뢰었다. 찬성하는 이도 있었고 백성을 기르는 정치에는 세금의 법도가 중요하다고 주장하는 이도 있었다.","choices":[{"text":"각계 의견을 종합하여 공법의 장단점을 계속 심의한다.","real":true},{"text":"반대 의견을 숨기고 찬성 보고만 올리게 한다.","real":false},{"text":"조사 결과를 보지 않고 즉시 제도를 폐기한다.","real":false}],"source":"https://sillok.history.go.kr/id/kda_11208010_005","terms":"가부: 찬성과 반대. 전세: 논밭에 매기는 세금."},{"id":"e4","year":"1430","title":"백성의 동원 시기를 논하다","body":"병조가 백성을 부역에 동원할 시기를 농사철과 겹치지 않게 정하자고 아뢰었다. 임금은 정부와 여러 조에 함께 의논하도록 명하였다.","choices":[{"text":"정부와 여러 조에 함께 의논하게 한다.","real":true},{"text":"병조의 건의를 논의 없이 즉시 확정한다.","real":false},{"text":"동원 시기의 제한을 두지 않는다.","real":false}],"source":"https://sillok.history.go.kr/id/kda_11212005_003","terms":"부역: 국가가 백성에게 부과한 노동 의무. 병조: 군사와 관련한 행정을 맡은 관청."},{"id":"border","year":"1434","title":"북방 지역을 정비하다","body":"세종대에는 압록강과 두만강 방면의 행정·방어 체계가 정비되었다. 김종서 등이 북방 지역의 경영에 참여하였다.","choices":[{"text":"북방 지역에 관청과 방어 시설을 정비한다.","real":true},{"text":"북방의 행정 체계를 철수한다.","real":false},{"text":"현지 사정을 조사하지 않고 정책을 정한다.","real":false}],"source":"https://encykorea.aks.ac.kr/Article/E0029857","terms":"사군·육진: 세종대 북방 지역에 설치·정비한 행정 및 방어 거점."},{"id":"tax_review","year":"1436","title":"공법상정소를 두다","body":"공법 논의는 즉시 결론나지 않았다. 세종 18년에는 공법상정소를 설치해 새 세법을 구체적으로 검토하였다.","choices":[{"text":"공법상정소를 설치하고 제도를 더 연구하게 한다.","real":true},{"text":"앞선 반대 의견을 무시하고 세법을 곧바로 확정한다.","real":false},{"text":"공법 논의를 영구히 중단한다.","real":false}],"source":"https://encykorea.aks.ac.kr/Article/E0029857","terms":"공법상정소: 공법을 상세히 정하기 위해 설치한 기구. 전세: 토지에 부과하는 세금."},{"id":"astronomy","year":"1442","title":"시간을 측정하는 기구","body":"세종대에는 천문·역법 연구와 관측 기구 제작이 활발했다. 강수량을 재는 측우기도 제작되어 관측에 활용되었다.","choices":[{"text":"측우기 제작과 관측 체계를 추진한다.","real":true},{"text":"강우 관측을 기록하지 않는다.","real":false},{"text":"관측을 궁중의 일회성 행사로만 한다.","real":false}],"source":"https://encykorea.aks.ac.kr/Article/E0029857","terms":"측우기: 강수량을 재는 기구. 역법: 달력과 시간의 계산 방법."},{"id":"e5","year":"1443","title":"훈민정음을 짓다","body":"이달에 임금이 친히 스물여덟 글자를 지었다. 초성·중성·종성을 합하여 글자를 이루며, 문자와 우리말을 모두 적을 수 있다고 기록되었다.","choices":[{"text":"새 문자를 훈민정음이라 이름 짓고 창제한다.","real":true},{"text":"새 문자 창제를 중단한다.","real":false},{"text":"문자를 만들되 궁중의 비밀 문자로만 남긴다.","real":false}],"source":"https://sillok.history.go.kr/id/wda_12512030_002","terms":"훈민정음: 백성을 가르치는 바른 소리. 초성·중성·종성: 음절을 이루는 첫소리·가운뎃소리·끝소리."},{"id":"tax_final","year":"1444","title":"토지와 풍흉에 따라 세금을 정하다","body":"오랜 논의 끝에 세종 26년 공법이 확정되었다. 토지의 비옥도와 해마다 다른 풍흉을 반영하는 체계가 마련되었다.","choices":[{"text":"전분 6등과 연분 9등을 반영한 공법을 확정한다.","real":true},{"text":"모든 토지에 같은 액수의 세금을 매긴다.","real":false},{"text":"관리의 답험에만 계속 의존한다.","real":false}],"source":"https://encykorea.aks.ac.kr/Article/E0004304","terms":"전분 6등: 토지의 비옥도를 여섯 등급으로 구분. 연분 9등: 그해 풍흉을 아홉 등급으로 구분."},{"id":"script_objection","year":"1444","title":"새 문자를 둘러싼 반대","body":"훈민정음 창제 뒤 최만리 등 일부 신하가 새 문자 사용에 반대하는 상소를 올렸다. 세종은 새 문자를 추진하는 입장을 굽히지 않았다.","choices":[{"text":"반대 상소를 검토하되 훈민정음 창제와 활용을 계속 추진한다.","real":true},{"text":"반대 상소를 받아들여 새 문자 사업을 폐지한다.","real":false},{"text":"새 문자를 왕실의 기록에만 사용한다.","real":false}],"source":"https://encykorea.aks.ac.kr/Article/E0029857","terms":"상소: 신하가 임금에게 의견을 올리는 글. 언문: 당시 새 문자를 가리키던 표현."},{"id":"medical","year":"1445","title":"의학 지식을 편찬하다","body":"세종대에는 향약집성방과 의방유취 등 의학 지식의 정리와 편찬이 이루어졌다. 기존 의서의 내용을 체계적으로 모으는 사업이었다.","choices":[{"text":"의학 지식을 모아 의서를 편찬하도록 지원한다.","real":true},{"text":"의서 편찬을 중단한다.","real":false},{"text":"궁중에 필요한 의술만 기록한다.","real":false}],"source":"https://encykorea.aks.ac.kr/Article/E0029857","terms":"향약: 우리 땅에서 나는 약재. 의방유취: 의학 내용을 분야별로 모은 책."},{"id":"e6","year":"1446","title":"훈민정음을 관리 선발에 넣다","body":"이조에 명하여 이과와 이전을 뽑을 때 훈민정음도 시험하게 하였다. 뜻을 깊이 알지 못하더라도 글자를 합쳐 쓸 수 있는 사람은 뽑도록 하였다.","choices":[{"text":"관리 선발 시험에 훈민정음을 함께 시험하게 한다.","real":true},{"text":"기존 시험만 유지하고 훈민정음은 제외한다.","real":false},{"text":"훈민정음 시험을 왕족에게만 허용한다.","real":false}],"source":"https://sillok.history.go.kr/id/kda_12812026_003","terms":"이조: 관리의 임명과 인사 업무를 맡은 관청. 취재: 필요한 재능을 시험해 인재를 뽑는 일."},{"id":"script_publish","year":"1446","title":"훈민정음을 널리 알리다","body":"1446년 훈민정음 해례본이 간행되었다. 새 문자의 원리와 사용법을 설명하는 글이 함께 제시되었다.","choices":[{"text":"훈민정음의 원리와 사용법을 설명하는 책을 간행한다.","real":true},{"text":"문자만 만들고 설명은 남기지 않는다.","real":false},{"text":"공식적으로 새 문자의 사용을 금한다.","real":false}],"source":"https://encykorea.aks.ac.kr/Article/E0029857","terms":"해례: 원리와 사용법을 풀이한 설명. 간행: 책을 인쇄하여 펴냄."},{"id":"e7","year":"1447","title":"함길도 관리 선발의 기준을 정하다","body":"함길도 자제의 관리 선발에서 여섯 재주를 모두 통과해야 할 필요는 없다고 하였다. 다음 식년부터는 먼저 훈민정음을 시험해 합격한 사람에게 다른 시험을 허락하도록 명하였다.","choices":[{"text":"훈민정음 시험을 먼저 보고, 합격한 사람에게 다른 시험 기회를 준다.","real":true},{"text":"훈민정음 시험 없이 종전의 모든 과목 합격만 요구한다.","real":false},{"text":"함길도 자제의 응시 자체를 막는다.","real":false}],"source":"https://sillok.history.go.kr/id/kda_12904020_001","terms":"식년: 정기적으로 시험 등을 치르는 해. 이과: 하급 실무 관리 선발 시험."},{"id":"music","year":"1447","title":"국가의 음악을 정비하다","body":"세종대에는 박연 등의 참여로 음악과 악기의 제도가 정비되었다. 국가 의례에서 쓰는 음악도 정리되었다.","choices":[{"text":"국가 의례의 음악과 악기 제도를 정비한다.","real":true},{"text":"의례 음악 정비를 중단한다.","real":false},{"text":"기존 악기의 음률을 살피지 않는다.","real":false}],"source":"https://encykorea.aks.ac.kr/Article/E0029857","terms":"아악: 국가의 의례에 쓰던 음악. 음률: 음악의 음높이와 체계."},{"id":"illness","year":"1450","title":"병환 속의 마지막 명령","body":"세종 32년 2월 15일 왕의 병환이 깊어졌다. 그날의 기록에는 중대한 죄를 제외한 죄인을 용서하는 유지가 실려 있다.","choices":[{"text":"중대한 예외를 두고 사면하는 유지를 내린다.","real":true},{"text":"일체의 사면을 거부한다.","real":false},{"text":"범죄의 종류를 따지지 않고 모두 사면한다.","real":false}],"source":"https://sillok.history.go.kr/id/kda_13202015_003","terms":"유지: 임금이나 왕실에서 내리는 뜻을 담은 명령. 사면: 죄를 용서하거나 형벌을 줄임."}];
let state={index:0,score:0,history:[],awaiting:false};
const $=id=>document.getElementById(id);
function render(){
 if(state.index>=EVENTS.length)return finish();
 const e=EVENTS[state.index];
 $('date').textContent=e.year+'년 · 기록 '+(state.index+1)+' / '+EVENTS.length;
 $('title').textContent=e.title;$('story').textContent=e.body;
 $('source').textContent='기록에 근거한 역사 상황. 다른 선택지는 실제 역사와 비교하기 위한 가정입니다.';
 $('terms').textContent=e.terms;$('link').href=e.source;
 $('feedback').classList.add('hidden');$('feedback').textContent='';
 $('choices').innerHTML='';
 e.choices.forEach((c,i)=>{let btn=document.createElement('button');btn.textContent=(i+1)+'. '+c.text;btn.onclick=()=>choose(i);$('choices').appendChild(btn)});
 $('history').innerHTML=state.history.map(h=>'<p>'+h.year+' · '+h.title+' : '+(h.correct?'세종의 실제 결정과 일치':'세종과 다른 선택')+'</p>').join('');
}
function choose(i){
 if(state.awaiting)return;const e=EVENTS[state.index],c=e.choices[i];
 const unscored=e.id==='birth';const delta=unscored?0:(c.real?10:-7);
 state.score+=delta;state.history.push({id:e.id,year:e.year,title:e.title,choice:c.text,correct:c.real,delta});state.awaiting=true;
 const real=e.choices.find(x=>x.real);
 $('feedback').classList.remove('hidden');
 $('feedback').textContent=unscored?'탄생 기록을 확인했습니다. 다음 시기로 이동합니다.':(c.real?'세종의 실제 결정과 일치합니다. +10점':'세종의 실제 결정과 다릅니다. −7점')+' 실제 기록: '+real.text;
 $('choices').innerHTML='';const next=document.createElement('button');next.textContent='다음 기록으로';next.onclick=()=>{state.index++;state.awaiting=false;render()};$('choices').appendChild(next);
 $('history').innerHTML=state.history.map(h=>'<p>'+h.year+' · '+h.title+' : '+(h.correct?'일치':'다름')+'</p>').join('');
}
function finish(){
 $('date').textContent='1450년 2월 17일 · 세종 32년';$('title').textContent='세종, 영응대군 집 동별궁에서 승하하다';
 $('story').textContent='《세종실록》은 세종이 영응대군 집 동별궁에서 승하했다고 기록한다. 이제 지금까지 내린 결정과 실제 세종의 행적을 비교한다.';
 $('source').textContent='세종실록 승하 기사';$('terms').textContent='점수는 역사 기록과 선택의 일치 여부이며, 정책의 도덕적 우열을 뜻하지 않습니다.';
 $('link').href='https://sillok.history.go.kr/id/kda_13202017_001';$('feedback').classList.add('hidden');
 const scored=state.history.filter(h=>h.id!=='birth'),matches=scored.filter(h=>h.correct).length;
 $('choices').innerHTML='<h2>총점 '+state.score+'점</h2><p>세종과 일치 '+matches+'건 · 다름 '+(scored.length-matches)+'건 / '+scored.length+'번의 결정</p><p>일치 +10점, 다름 −7점 · 점수 제한 없음</p>';
 const restartButton=document.createElement('button');restartButton.textContent='다시 시작';restartButton.onclick=restart;$('choices').appendChild(restartButton);
 $('history').innerHTML=state.history.map(h=>'<p>'+h.year+' · '+h.title+' · '+(h.id==='birth'?'기록 확인':(h.correct?'일치 +10점':'다름 −7점'))+'</p>').join('');
}
function restart(){state={index:0,score:0,history:[],awaiting:false};render()}
render();
</script></body></html>
