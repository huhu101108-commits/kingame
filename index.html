function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Number.isInteger(s.idx)&&s.idx>=0&&s.idx<=EVENTS.length&&Array.isArray(s.values)&&s.values.length===5&&Array.isArray(s.log)&&['intro','play','result','end'].includes(s.phase))state=s}catch(e){}}
function show(id){for(const x of ['hero','game','ending'])$(x).classList.toggle('hidden',x!==id)}
function renderStats(){ $('stats').innerHTML=DIM.map((d,i)=>`<div class="stat"><div class="statline"><span>${d}</span><span>${state.values[i]}/10</span></div><div class="bar"><div class="fill" style="width:${state.values[i]*10}%"></div></div></div>`).join('');$('history').innerHTML=state.log.length?state.log.slice(-5).reverse().map(x=>`<div><span style="color:#d6b77b">${x.no}.</span> ${x.title}<br>${x.choice}</div>`).join(''):'아직 기록이 없습니다.'}
function render(){if(state.phase==='intro'){show('hero');return}if(state.phase==='end'){renderEnd();return}show('game');renderStats();const e=EVENTS[state.idx];$('chapter').textContent=`재위의 기록 ${String(state.idx+1).padStart(2,'0')} / ${EVENTS.length}`;$('progressfill').style.width=`${(state.idx/EVENTS.length)*100}%`;$('title').textContent=e.t;$('scene').textContent=e.s;$('source').innerHTML=`<strong>관련 역사 배경</strong> · ${e.src}<br><a href="${e.q}" target="_blank" rel="noopener noreferrer">한국민족문화대백과사전에서 찾아보기 ↗</a><br><span style="opacity:.8">이 장면은 실제 왕의 특정 사건을 재현한 것이 아니라 역사적 쟁점을 재구성한 가상 상황입니다.</span>`;const done=state.phase==='result';$('choices').classList.toggle('hidden',done);$('outcome').classList.toggle('hidden',!done);$('next').classList.toggle('hidden',!done);if(done){$('outcome').textContent=state.pending.outcome;$('next').textContent=state.idx===EVENTS.length-1?'나의 왕도 분석하기 →':'다음 국정으로 →'}else{$('choices').innerHTML='';e.c.forEach((c,i)=>{const b=document.createElement('button');b.className='choice';const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.textContent=c[0];b.append(n,t);b.onclick=()=>choose(i);$('choices').append(b)})}}
function choose(i){if(state.phase!=='play')return;const e=EVENTS[state.idx],c=e.c[i],before=[...state.values];state.values=state.values.map((v,j)=>clamp(v+c[1][j]));const tension=before[2]>=8&&i===0&&[1,4,5,10].includes(state.idx);const nuance=tension?' 다만 강한 왕권을 지지하던 세력이 새 결정을 의심하기 시작했다.':before[0]<=3&&[0,6,9].includes(state.idx)&&i===0?' 재정이 빠듯해 시행 규모는 일부 줄었다.':'';state.pending={outcome:c[2]+nuance};state.log.push({no:state.idx+1,title:e.t,choice:c[0],delta:c[1]});state.phase='result';persist();render()}
function next(){if(state.phase!=='result')return;state.idx++;state.pending=null;state.phase=state.idx>=EVENTS.length?'end':'play';persist();render()}
function score(k){const diff=k.v.reduce((a,x,i)=>a+Math.pow(x-state.values[i],2),0);return Math.max(0,Math.round(100-1.1*diff))}
function renderEnd(){show('ending');const rank=KINGS.map(k=>({...k,score:score(k)})).sort((a,b)=>b.score-a.score),best=rank[0];$('ending').innerHTML=`<div class="eyebrow">YOUR ROYAL LEGACY</div><h2 style="font-size:32px">당신의 왕도는</h2><div class="king">${best.n}</div><div style="font-family:'Noto Serif KR',serif;font-size:19px">와 가장 닮았습니다.</div><p class="sub">${best.d}</p><div class="traits" style="justify-content:center">${best.tags.map(x=>`<span class="trait">${x}</span>`).join('')}</div><p class="small">유사도 ${best.score}점 · 선택으로 형성된 5개 지표와 게임 속 왕별 기준값을 비교한 결과입니다.</p><div style="max-width:420px;margin:24px auto;text-align:left"><h3 style="color:var(--gold)">다른 왕과의 비교</h3>${rank.slice(1,4).map(k=>`<div class="compare"><span>${k.n}</span><strong>${k.score}점</strong></div>`).join('')}</div><p class="small">왕들의 실제 업적과 성격을 단순화한 해석이며, 역사적 평가나 성격 검사가 아닙니다.</p><button class="action" id="again">다시 즉위하기</button><button class="action" id="copyresult" style="margin-left:8px;background:transparent;border:1px solid #aa966c;color:#e5c991">결과 복사</button>`;$('again').onclick=restart;$('copyresult').onclick=()=>{const txt=`어좌 v${VERSION}: 나는 ${best.n}과 가장 닮은 왕 (${best.score}점)!`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>alert('결과를 복사했습니다.')).catch(()=>prompt('결과를 복사하세요',txt));else prompt('결과를 복사하세요',txt)}}
function restart(){state={idx:0,values:[5,5,5,5,5],log:[],phase:'intro',pending:null};persist();render()}
$('start').onclick=()=>{state.phase='play';persist();render()};$('reset').onclick=()=>{if(confirm('현재 왕의 기록을 지우고 처음부터 시작할까요?'))restart()};$('next').onclick=next;load();render();
</script></body></html>
