{t:'흉년이 들다',s:'세 해째 비가 부족하다. 백성은 굶주리고 창고의 곡식은 넉넉하지 않다. 대신들이 구휼을 놓고 다툰다.',src:'조선의 환곡·진휼 제도',q:'https://encykorea.aks.ac.kr/Article/E0060834',c:[['창고를 열어 백성을 구휼한다',[3,0,-1,0,0],'백성의 원망이 잦아들지만 국고가 줄었다.'],['세금을 줄이고 지방의 자율 구휼을 명한다',[2,1,0,0,0],'지방마다 성과가 달랐지만 부담은 다소 줄었다.'],['군량을 지키고 지출을 억제한다',[-2,0,2,0,0],'국고는 지켰지만 굶주림을 견디지 못한 이들이 떠났다.']]},
{t:'공신의 횡포',s:'개국에 공을 세운 대신이 백성의 토지를 빼앗았다는 상소가 올라왔다. 그를 벌하면 조정의 균형이 흔들릴 수 있다.',src:'조선 초기 공신 정치와 왕권',q:'https://encykorea.aks.ac.kr/Article/E0004402',c:[['신분과 공을 막론하고 조사한다',[2,2,2,0,0],'법을 세웠지만 공신 세력이 반발했다.'],['재산을 돌려주게 하고 죄는 덮는다',[1,0,-1,0,0],'피해는 일부 회복됐으나 공신은 자리를 지켰다.'],['공신의 권한을 인정한다',[-2,-2,2,0,0],'조정은 잠잠했지만 백성의 불신이 커졌다.']]},
{t:'새 글자를 만들자는 제안',s:'학자들이 백성이 쉽게 익힐 문자를 연구하자고 청한다. 일부 신하는 기존 질서가 무너질 것이라 걱정한다.',src:'훈민정음 창제',q:'https://encykorea.aks.ac.kr/Article/E0065703',c:[['연구를 지원하고 널리 보급한다',[2,3,0,0,3],'글을 배우는 사람이 늘기 시작했다.'],['학자에게만 제한적으로 연구하게 한다',[0,1,1,0,2],'연구는 계속되지만 보급은 더디다.'],['기존 문자와 학문 체계를 유지한다',[-1,-2,2,0,-2],'신하들의 지지는 얻었지만 새로운 배움의 길은 막혔다.']]},
{t:'북방의 긴장',s:'변방에서 충돌이 잦아졌다. 장수는 군대를 보내자 하고, 사신은 협상할 기회가 있다고 말한다.',src:'조선의 북방 정책',q:'https://encykorea.aks.ac.kr/Article/E0024102',c:[['국경 방어를 강화하되 협상한다',[0,1,1,3,0],'충돌을 억제하며 시간을 벌었다.'],['군대를 보내 강경하게 대응한다',[-1,0,3,-2,0],'군의 사기는 올랐지만 전쟁의 위험이 커졌다.'],['사신을 보내 양보안을 제시한다',[1,0,-1,2,0],'당장의 충돌은 줄었지만 조정에서 비판이 나왔다.']]},
{t:'붕당의 대립',s:'서로 다른 당파가 인사권을 두고 맞선다. 한쪽을 선택하면 정국을 빠르게 장악할 수 있다.',src:'조선 붕당 정치',q:'https://encykorea.aks.ac.kr/Article/E0024927',c:[['당파를 가리지 않고 능력으로 등용한다',[1,2,1,0,1],'새 인물이 등용됐으나 양쪽 모두 경계했다.'],['한 당파를 중심으로 정국을 운영한다',[0,-1,3,0,0],'결정은 빨라졌지만 반대 세력이 결집했다.'],['서로 타협할 기구를 마련한다',[1,2,-1,0,1],'합의는 더뎠지만 충돌을 줄일 통로가 생겼다.']]},

  relief:{t:'진휼의 실효',age:29,era:'재위 · 민생 분기',s:'구휼을 명했지만 지방의 곡식 배분이 고르지 않다는 보고가 올라왔다.',terms:['진휼','환곡'],src:'조선왕조실록의 진휼 및 환곡 운영 관련 기록 참고 · 창작 상황',q:'https://sillok.history.go.kr/',c:[['감사를 보내 배분 기록을 조사한다',[2,1,0,0,0],'부정한 배분을 바로잡는 데 시간이 들었다.'],['지방관의 재량에 맡기되 보고를 받는다',[1,0,1,0,0],'신속히 처리했으나 지역별 차이는 남았다.'],['창고를 추가로 열어 부족분을 메운다',[2,0,-1,0,0],'당장의 부족을 덜었으나 재정 부담이 커졌다.']]},
  treasury:{t:'재정의 한계',age:29,era:'재위 · 재정 분기',s:'조정은 구휼에 쓸 곡식이 부족하다고 보고한다. 백성의 부담을 늘리기도 어렵다.',terms:['진휼','조정'],src:'조선왕조실록의 구휼 재정 논의 참고 · 창작 상황',q:'https://sillok.history.go.kr/',c:[['궁중 지출을 줄인다',[2,1,-1,0,0],'왕실 지출을 줄여 일부 재원을 마련했다.'],['지방별 사정을 다시 조사한다',[1,1,0,0,1],'지원은 늦어졌지만 형편을 구분할 수 있었다.']]},
  remonstrance:{t:'대간의 상소',age:38,era:'재위 · 정치 분기',s:'인사 결정에 반대하는 상소가 올라왔다. 신하들은 임금의 판단을 다시 살펴 달라고 청한다.',terms:['상소','인사권'],src:'조선왕조실록의 대간과 상소 제도 참고 · 창작 상황',q:'https://sillok.history.go.kr/',c:[['반대 의견을 공개적으로 논의한다',[0,2,-1,0,1],'논쟁은 길어졌지만 여러 근거가 드러났다.'],['결정을 유지하고 책임을 지겠다고 한다',[0,0,2,0,0],'결정은 빨랐으나 일부 신하가 반발했다.'],['인사안을 수정해 다시 올리게 한다',[1,1,0,0,0],'갈등을 일부 줄였다.']]},
  scholars:{t:'학자들의 건의',age:38,era:'재위 · 학문 분기',s:'학자들이 경전 교육을 넓히자고 건의한다. 조정은 비용과 효과를 따진다.',terms:['경연','사림'],src:'조선왕조실록의 교육·경연 관련 기록 참고 · 창작 상황',q:'https://sillok.history.go.kr/',c:[['지방 교육의 여건부터 조사한다',[1,1,0,0,2],'지역의 교육 격차를 살폈다.'],['왕실의 학술 사업부터 지원한다',[0,1,1,0,2],'학술 활동이 활발해졌으나 혜택은 제한적이었다.']]}
};
// 기본 사건 뒤에 갈라지는 길. 조건은 이전 선택 번호와 실제 누적 지표만 사용한다.
const ROUTES={
  2:[{when:s=>s.decisions[2]===1,to:'tutor'},{when:s=>s.decisions[2]===2,to:'faction'}],
  6:[{when:s=>s.decisions[6]===0,to:'relief'},{when:s=>s.values[0]<=5,to:'treasury'}],
  10:[{when:s=>s.values[2]>=7,to:'remonstrance'},{when:s=>s.values[4]>=7,to:'scholars'}]
};
const EXTRA_CHOICES={
  4:[{when:s=>s.decisions[2]===2,c:['왕자 시절에 모은 인맥을 활용한다',[0,0,2,0,0],'오래된 인맥을 통해 조정의 분위기를 파악했다.']}],
  7:[{when:s=>s.values[0]<=4,c:['재정 부족을 먼저 보고받는다',[1,1,0,0,0],'구휼의 재정 한계를 확인했다.']}],
  10:[{when:s=>s.values[4]>=7,c:['경연에서 각 붕당의 주장을 검토한다',[0,2,-1,0,2],'논쟁을 기록으로 비교했다.']}]
};
let state={idx:0,values:[5,5,5,5,5],log:[],phase:'intro',pending:null,branch:null,decisions:{},visited:[],branchQueue:[]};
const $=id=>document.getElementById(id),clamp=x=>Math.max(0,Math.min(10,x));
const current=()=>state.branch?BRANCHES[state.branch]:EVENTS[state.idx];
const options=e=>e.c.concat(state.branch?[]:(EXTRA_CHOICES[state.idx]||[]).filter(x=>x.when(state)).map(x=>x.c));
function persist(){try{localStorage.setItem(KEY,JSON.stringify(state))}catch(e){}}
function load(){try{const s=JSON.parse(localStorage.getItem(KEY));if(s&&Number.isInteger(s.idx)&&s.idx>=0&&s.idx<EVENTS.length&&Array.isArray(s.values)&&s.values.length===5&&Array.isArray(s.log)&&['intro','play','result','end'].includes(s.phase)){state={...state,...s};if(!state.decisions)state.decisions={};if(!Array.isArray(state.visited))state.visited=[];if(!Array.isArray(state.branchQueue))state.branchQueue=[];if(state.branch&&!BRANCHES[state.branch])state.branch=null}}catch(e){}}
function show(id){for(const x of ['hero','game','ending'])$(x).classList.toggle('hidden',x!==id)}
function renderStats(){$('stats').innerHTML=DIM.map((d,i)=>`<div class="stat"><div class="statline"><span>${d}</span><span>${state.values[i]}/10</span></div><div class="bar"><div class="fill" style="width:${state.values[i]*10}%"></div></div></div>`).join('');$('history').replaceChildren();if(!state.log.length){$('history').textContent='아직 기록이 없습니다.';return}state.log.slice(-5).reverse().forEach(x=>{const line=document.createElement('div');line.textContent=`${x.age}세 · ${x.title} — ${x.choice}`;$('history').append(line)})}
function render(){if(state.phase==='intro'){show('hero');return}if(state.phase==='end'){renderEnd();return}show('game');renderStats();const e=current();const pr=precedent(e);$('precedent').replaceChildren();const pn=document.createElement('strong');pn.style.color='#e2c18c';pn.textContent=pr[0];$('precedent').append(pn,document.createElement('div'),document.createTextNode(pr[1]),document.createElement('div'),document.createTextNode('선택지는 이 기록을 바탕으로 재구성한 가상 정책 대안입니다.'));$('chapter').textContent=`${e.era} · ${e.age}세 · 기록 ${state.log.length+1}`;$('glossary').replaceChildren();(e.terms||[]).forEach(term=>{const line=document.createElement('div'),strong=document.createElement('strong');strong.style.color='#e2c18c';strong.textContent=term;line.append(strong,document.createTextNode(' — '+(GLOSS[term]||'조선시대 역사 용어')));$('glossary').append(line)});$('progressfill').style.width=`${Math.min(100,state.idx/EVENTS.length*100)}%`;$('title').textContent=e.t;$('scene').textContent=e.s;$('source').replaceChildren();const strong=document.createElement('strong');strong.textContent='역사적 배경';const a=document.createElement('a');a.href=e.q;a.target='_blank';a.rel='noopener noreferrer';a.textContent='자료 열기 ↗';$('source').append(strong,document.createTextNode(' · '+e.src+' '),a,document.createElement('br'),document.createTextNode('사건의 역사적 선례는 오른쪽에서 확인할 수 있습니다. 선택지와 결과는 실제 사료의 인용이 아닌 가상 재구성입니다.'));const done=state.phase==='result';$('choices').classList.toggle('hidden',done);$('outcome').classList.toggle('hidden',!done);$('next').classList.toggle('hidden',!done);if(done){$('outcome').textContent=state.pending.outcome;$('next').textContent=(!state.branch&&state.idx===EVENTS.length-1)?'나의 왕도 분석하기 →':'다음 기록으로 →'}else{$('choices').replaceChildren();options(e).forEach((c,i)=>{const b=document.createElement('button');b.className='choice';const n=document.createElement('span');n.className='num';n.textContent=String(i+1).padStart(2,'0');const t=document.createElement('span');t.textContent=c[0];const note=document.createElement('small');note.style.cssText='display:block;color:#b7c2b0;font-size:11px;margin-top:5px';note.textContent='역사적 제도·정책에 근거한 가상 선택';t.append(note);b.append(n,t);b.onclick=()=>choose(i);$('choices').append(b)})}}
function choose(i){if(state.phase!=='play')return;const e=current(),c=options(e)[i];if(!c)return;const before=[...state.values];state.values=state.values.map((v,j)=>clamp(v+c[1][j]));const id=state.branch||String(state.idx);state.decisions[id]=i;const tension=before[2]>=8&&i===0&&[1,4,5,10].includes(state.idx);const nuance=tension?' 왕권을 중시하던 신하들이 새 결정을 의심했다.':before[0]<=3&&[0,6,9].includes(state.idx)&&i===0?' 재정 부족으로 시행 규모를 조정했다.':'';state.pending={outcome:c[2]+nuance};state.log.push({no:state.log.length+1,title:e.t,choice:c[0],delta:c[1],age:e.age,branch:state.branch});state.phase='result';persist();render()}
function next(){if(state.phase!=='result')return;if(state.branch){state.visited.push(state.branch);state.branch=null;state.idx++}else{const route=(ROUTES[state.idx]||[]).find(x=>x.when(state)&&!state.visited.includes(x.to));if(route)state.branch=route.to;else state.idx++}state.pending=null;state.phase=state.idx>=EVENTS.length?'end':'play';persist();render()}
function score(k){const diff=k.v.reduce((a,x,i)=>a+Math.pow(x-state.values[i],2),0);return Math.max(0,Math.round(100-1.1*diff))}
function renderEnd(){show('ending');const rank=KINGS.map(k=>({...k,score:score(k)})).sort((a,b)=>b.score-a.score),best=rank[0];$('ending').innerHTML=`<div class="eyebrow">YOUR ROYAL LEGACY</div><h2 style="font-size:32px">당신의 왕도는</h2><div class="king">${best.n}</div><div style="font-family:'Noto Serif KR',serif;font-size:19px">와 가장 닮았습니다.</div><p class="sub">${best.d}</p><div class="traits" style="justify-content:center">${best.tags.map(x=>`<span class="trait">${x}</span>`).join('')}</div><p class="small">유사도 ${best.score}점 · 선택으로 형성된 5개 지표와 게임 속 왕별 기준값을 비교한 결과입니다.</p><div style="max-width:420px;margin:24px auto;text-align:left"><h3 style="color:var(--gold)">다른 왕과의 비교</h3>${rank.slice(1,4).map(k=>`<div class="compare"><span>${k.n}</span><strong>${k.score}점</strong></div>`).join('')}</div><p class="small">왕들의 실제 업적과 성격을 단순화한 해석이며, 역사적 평가나 성격 검사가 아닙니다.</p><button class="action" id="again">다시 태어나기</button><button class="action" id="copyresult" style="margin-left:8px;background:transparent;border:1px solid #aa966c;color:#e5c991">결과 복사</button>`;$('again').onclick=restart;$('copyresult').onclick=()=>{const txt=`어좌 v${VERSION}: 나는 ${best.n}과 가장 닮은 왕 (${best.score}점)!`;if(navigator.clipboard?.writeText)navigator.clipboard.writeText(txt).then(()=>alert('결과를 복사했습니다.')).catch(()=>prompt('결과를 복사하세요',txt));else prompt('결과를 복사하세요',txt)}}
function restart(){state={idx:0,values:[5,5,5,5,5],log:[],phase:'intro',pending:null,branch:null,decisions:{},visited:[],branchQueue:[]};persist();render()}
$('start').onclick=()=>{state.phase='play';persist();render()};$('reset').onclick=()=>{if(confirm('현재 왕의 기록을 지우고 처음부터 시작할까요?'))restart()};$('next').onclick=next;load();render();
</script></body></html>
