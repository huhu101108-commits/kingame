<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>어좌 | 실록의 갈림길 v2.0</title><style>

ackground:#243d33;color:#fff;border:0;border-radius:5px;padding:14px 20px}.small{font-size:13px}.muted{opacity:.75}@media(max-width:750px){main{grid-template-columns:1fr}.panel{padding:22px}.side{padding:20px}header{padding-top:15px}.logo{font-size:25px}}
</style></head><body><header><div class="logo">御座 · 어좌</div><div class="version">실록의 갈림길 · v2.1.0</div></header><main><section class="panel" id="game"></section><aside class="side" id="notes"></aside></main><script>
const VERSION='2.1.0';
const NODES=[{"id":"birth","year":1397,"age":0,"title":"왕자의 탄생","body":"1397년, 왕실에 왕자가 태어난다. 훗날 왕실에서는 양녕대군의 처우를 둘러싸고 임금과 대간의 의견이 갈리게 된다.","source":"https://sillok.history.go.kr/id/kda_10010017_007","proof":"1397년 탄생 장면은 가상이다. 연결된 1418년 기사는 왕자 탄생을 증명하지 않고 양녕대군의 처우 논쟁을 기록한다.","gloss":{"종사":"왕실과 국가의 근본을 뜻하는 말"},"choices":[{"text":"가족의 화합을 우선하는 인물로 성장한다","next":"study","delta":{"care":2}},{"text":"왕위 계승의 규범을 중시하는 인물로 성장한다","next":"study","delta":{"power":2}}],"sourceStatus":"후대 사료를 활용한 가상 장면 · 직접 증거 아님","sourceChecked":true},{"id":"study","year":1409,"age":12,"title":"왕자의 배움","body":"왕자가 배움의 길에 들어선다. 후일 세종 2년 이조는 집현전에 서리 열 명을 두되 실직 다섯 명과 예비 다섯 명으로 나누자고 아뢰었고, 임금이 따랐다.","source":"https://sillok.history.go.kr/id/kda_10204012_006","proof":"1420년 기록은 집현전 서리의 인원 배치에 관한 것이다. 왕자의 수업 내용은 기록되지 않아 이 장면은 가상으로 표시한다.","gloss":{"집현전":"조선 전기의 학술 연구 기관"},"choices":[{"text":"학문과 토론에 집중한다","next":"succession","delta":{"learn":2}},{"text":"국정 실무와 제도를 살핀다","next":"succession","delta":{"power":1,"reform":1}}],"sourceStatus":"후대 사료를 활용한 가상 장면 · 직접 증거 아님","sourceChecked":true},{"id":"succession","year":1418,"age":21,"title":"형제와 왕위","body":"대사헌 허지 등이 양녕대군을 상왕이 궁으로 부른 일을 문제 삼았다. 임금은 부자와 형제 사이에 서로 보고 싶은 정이 있다며 거듭 청하지 말라고 하였다.","source":"https://sillok.history.go.kr/id/kda_10010017_007","proof":"1418년 10월 17일 기사: 대간은 양녕대군의 입궐을 문제 삼았고, 임금은 가족 간의 정을 이유로 만남을 옹호했다.","gloss":{"대간":"왕의 잘못을 비판하고 관리를 감찰하던 언관"},"choices":[{"text":"형제의 만남을 허용한다","next":"crown","delta":{"care":2}},{"text":"대간의 우려를 먼저 듣는다","next":"crown","delta":{"power":2}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"crown","year":1418,"age":21,"title":"즉위와 상왕","body":"새 임금이 즉위하였으나 상왕의 명령과 새 임금의 명령을 어떻게 부를지 의논이 이어진다. 왕위가 옮겨진 뒤에도 상왕의 권위가 남아 있었다.","source":"https://sillok.history.go.kr/id/kda_10008015_003","proof":"1418년 8월 15일 기록에 나타난 상왕의 명령과 새 임금의 권한을 둘러싼 논의에 따른 재구성이다.","gloss":{"상왕":"왕위를 물려주고 물러난 전임 국왕","선지":"상왕의 명령을 가리키는 말"},"choices":[{"text":"상왕의 권위를 분명히 존중한다","next":"court","delta":{"power":2}},{"text":"왕과 상왕의 역할을 명확히 나눈다","next":"court","delta":{"reform":2}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"court","year":1418,"age":21,"title":"왕실 의례","body":"임금은 제릉에 참배하여 즉위를 알리고자 유후사로 향하여 원평에 머물렀다. 의정부와 육조의 당상, 대간에서 각 한 사람씩 행차를 수행하도록 명하였다.","source":"https://sillok.history.go.kr/id/kda_10010018_003","proof":"1418년 10월 18일 기사: 제릉 참배 계획, 원평 체류, 의정부·육조·대간의 수행 명령이 기록되어 있다.","gloss":{"육조":"이조·호조·예조·병조·형조·공조"},"choices":[{"text":"관례를 지키며 신중하게 진행한다","next":"library","delta":{"power":2}},{"text":"신하들의 의견을 폭넓게 듣는다","next":"library","delta":{"care":1,"learn":1}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"library","year":1420,"age":23,"title":"집현전 운영","body":"이조가 집현전에 서리 열 명을 두자고 아뢰었다. 경연의 예에 따라 실직 다섯 명과 예비 다섯 명을 두자는 청을 임금이 따랐다.","source":"https://sillok.history.go.kr/id/kda_10204012_006","proof":"1420년 4월 12일 기사: 집현전 서리 열 명을 실직과 예비로 나누자는 이조의 건의가 받아들여졌다.","gloss":{"서리":"관청에서 문서·행정을 맡던 실무 관리"},"choices":[{"text":"학술기관의 인력을 충실히 확보한다","next":"farm","delta":{"learn":2}},{"text":"행정 비용을 살피며 운영한다","next":"farm","delta":{"power":1,"care":1}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"farm","year":1429,"age":32,"title":"농사직설","body":"정초 등이 《농사직설》을 편찬하였다. 여러 도의 관찰사에게 노농의 경험을 물어 보고하게 하고, 정초와 변효문이 내용을 가려 책으로 묶었다.","source":"https://sillok.history.go.kr/id/kda_11105016_002","proof":"1429년 5월 16일 《농사직설》 서문: 지역별 농법을 수집하여 중복을 덜고 요긴한 내용을 뽑아 편찬한 과정이 기록되어 있다.","gloss":{"농사직설":"조선의 풍토에 맞는 농사법을 정리한 책"},"choices":[{"text":"현장의 농법을 널리 수집한다","next":"border","delta":{"care":2,"learn":1}},{"text":"중앙에서 내용을 엄격히 정리한다","next":"border","delta":{"power":2}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"border","year":1433,"age":36,"title":"북방 관찰사","body":"김종서를 이조 우참판으로 낙점하고 함길도 관찰사로 삼았다. 같은 기사에 우승범과 황치신의 관직 제수도 함께 기록되었다.","source":"https://sillok.history.go.kr/id/kda_11512009_002","proof":"1433년 12월 9일 기사는 김종서의 함길도 관찰사 임명 사실을 기록한다. 인선 기준을 두고 벌인 토론은 창작이다.","gloss":{"관찰사":"도의 행정과 군사 등을 감독한 지방관"},"choices":[{"text":"현지 사정을 아는 관리를 중시한다","next":"rain","delta":{"diplomacy":2}},{"text":"중앙의 통솔 능력을 중시한다","next":"rain","delta":{"power":2}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"rain","year":1442,"age":45,"title":"비의 양을 재다","body":"호조는 비의 양을 재는 방법을 조목별로 아뢰었다. 서울에서는 측우기를 만들어 비가 온 때와 그친 때, 물의 깊이를 재어 기록하고 보고하도록 하였다.","source":"https://sillok.history.go.kr/id/kda_12405008_001","proof":"1442년 5월 8일 기사: 측우기의 크기, 관측 방법, 보고 절차가 구체적으로 제시되어 있다.","gloss":{"호조":"재정과 조세 등을 맡은 중앙 관청","측우기":"강수량을 재는 기구"},"choices":[{"text":"전국에 같은 관측 규칙을 적용한다","next":"palace","delta":{"learn":2,"reform":1}},{"text":"지역별 여건에 맞게 단계적으로 도입한다","next":"palace","delta":{"care":2}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"regent","year":1443,"age":46,"title":"세자의 정무 참여","body":"최만리 등은 세자가 남쪽을 향해 조회를 받고 신하들의 칭호를 받도록 한 조치를 반대하였다. 정권이 둘로 나뉘는 폐단을 걱정한다는 상소였다.","source":"https://sillok.history.go.kr/id/kda_12504019_002","proof":"1443년 4월 19일 기사: 세자의 섭정과 남면 조회에 대한 최만리 등의 반대 상소.","gloss":{"섭행":"다른 사람을 대신해 정사를 처리함","조회":"신하들이 임금에게 문안하고 정무를 아뢰는 의식"},"choices":[{"text":"세자의 정무 참여를 추진한다","next":"regent_follow","delta":{"reform":2}},{"text":"신하들의 우려를 수용한다","next":"script","delta":{"power":2}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"regent_follow","year":1443,"age":46,"title":"섭정에 대한 재상소","body":"최만리 등은 정권을 둘로 나누는 일은 옛사람도 경계했다고 주장하였다. 세자가 정사를 대신하는 조치가 나라의 오래된 법을 해칠 수 있다고 하였다.","source":"https://sillok.history.go.kr/id/kda_12504019_002","proof":"같은 1443년 4월 19일 상소의 논거를 나누어 제시한 후속 장면이다. 새로운 상소가 또 있었다는 뜻은 아니다.","gloss":{"상소":"신하가 왕에게 글로 의견을 올리는 일"},"choices":[{"text":"반대 의견을 다시 듣는다","next":"script","delta":{"care":2}},{"text":"기존 결정을 유지한다","next":"script","delta":{"power":2}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"palace","year":1443,"age":46,"title":"새 궁궐 건설 논쟁","body":"사간원 우사간 신기 등은 새 이궁을 짓는 일을 그만두라고 상소하였다. 이미 거처할 궁궐이 있고, 간의대를 허무는 데에도 백성의 노력이 헛되이 든다고 지적하였다.","source":"https://sillok.history.go.kr/id/kda_12501022_002","proof":"1443년 1월 22일 기사: 신기 등이 이궁 건설과 간의대 철거를 비판한 상소.","gloss":{"사간원":"왕에게 간언하던 기관","이궁":"임금이 옮겨 거처할 궁궐"},"choices":[{"text":"공사를 멈추고 부담을 줄인다","next":"corrupt","delta":{"care":2}},{"text":"필요성을 설명하고 공사를 계속한다","next":"corrupt","delta":{"power":2}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"corrupt","year":1443,"age":46,"title":"관원의 뇌물 문제","body":"사간원은 감사 이익박이 쌀과 콩 백여 섬을 가져와 관원들에게 나누어 주었다고 상소하였다. 이미 두 차례 처벌을 청했으나 허락받지 못했다고 밝혔다.","source":"https://sillok.history.go.kr/id/kda_12504016_002","proof":"1443년 4월 16일 기사: 이익박 등의 증여와 사간원의 거듭된 처벌 요구가 기록되어 있다.","gloss":{"감사":"도를 감독하던 관찰사","장물":"부정한 방법으로 얻은 재물"},"choices":[{"text":"관련자 전원을 조사한다","next":"regent","delta":{"reform":2}},{"text":"사실관계를 단계적으로 확인한다","next":"regent","delta":{"power":1,"care":1}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"script","year":1443,"age":46,"title":"새 문자의 창제","body":"이달 임금이 친히 언문 스물여덟 글자를 만들었다. 초성·중성·종성을 합쳐 글자를 이루며, 우리말도 적을 수 있는 글자를 훈민정음이라 불렀다.","source":"https://sillok.history.go.kr/id/wda_12512030_002","proof":"1443년 12월 30일 기사: 임금이 언문 28자를 직접 만들었다는 사실과 글자의 구성 방식이 기록되어 있다.","gloss":{"훈민정음":"백성을 가르치는 바른 소리라는 뜻의 문자 이름"},"choices":[{"text":"새 문자의 교육·보급을 추진한다","next":"petition","delta":{"learn":2,"reform":1}},{"text":"기존 문서 체계와의 조화를 우선한다","next":"petition","delta":{"power":2}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"petition","year":1444,"age":47,"title":"언문 반대 상소","body":"집현전 부제학 최만리 등이 언문 제작을 반대하는 상소를 올렸다. 중국과의 관계, 한자 학습, 새 문자의 시행을 둘러싼 우려를 조목조목 아뢰었다.","source":"https://sillok.history.go.kr/id/kda_12602020_001","proof":"1444년 2월 20일 기사: 최만리 등이 언문 창제에 반대하며 제시한 논거와 이에 대한 논의가 기록되어 있다.","gloss":{"언문":"당시 새로 만든 문자를 부르던 이름","집현전 부제학":"집현전의 관직 이름"},"choices":[{"text":"반대 논거를 듣되 새 문자 연구를 이어간다","next":"exam","delta":{"learn":2}},{"text":"반대 의견을 수용해 보급을 늦춘다","next":"exam","delta":{"power":2}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true},{"id":"exam","year":1447,"age":50,"title":"관리 선발과 훈민정음","body":"이조에 내린 명령에서 함길도 자제의 관리 선발 시험을 고치도록 하였다. 다음 식년부터 훈민정음을 먼저 시험하고 합격한 사람에게 다른 시험을 치르게 하라고 하였다.","source":"https://sillok.history.go.kr/id/kda_12904020_001","proof":"1447년 4월 20일 기사: 함길도 관리 선발과 각 관아의 이과 시험에 훈민정음을 반영하도록 한 명령.","gloss":{"이과":"하급 실무 관리 선발 시험","취재":"기술·실무 능력을 시험해 인재를 뽑음"},"choices":[{"text":"훈민정음 이해를 시험에 반영한다","next":"end","delta":{"learn":2,"reform":1}},{"text":"기존 실무 과목의 비중을 유지한다","next":"end","delta":{"power":2}}],"sourceStatus":"원문 대조 완료 · 역사적 대안은 가상","sourceChecked":true}];
const BY_ID=Object.fromEntries(NODES.map(n=>[n.id,n]));
const PROFILES={세종:{care:8,power:4,reform:9,learn:10,diplomacy:5},태종:{care:4,power:10,reform:8,learn:5,diplomacy:5},정조:{care:7,power:7,reform:9,learn:9,diplomacy:6},영조:{care:7,power:8,reform:7,learn:7,diplomacy:6},성종:{care:6,power:7,reform:6,learn:9,diplomacy:5}};
let state;
function reset(){state={id:'birth',score:{care:5,power:5,reform:5,learn:5,diplomacy:5},path:[],choices:0};render()}
function esc(s){return String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
function choose(i){const n=BY_ID[state.id],c=n.choices[i];if(!c)return;state.path.push({node:n.id,choice:i,text:c.text});state.choices++;for(const [k,v] of Object.entries(c.delta))state.score[k]+=v;state.id=c.next;render()}
function similarities(){let scores=Object.entries(PROFILES).map(([name,ref])=>{let distance=0;for(const k of Object.keys(ref)){const v=Math.min(10,Math.max(0,state.score[k]/2));distance+=Math.pow(v-ref[k],2)}return {name,pct:Math.min(99.9,Math.max(0,100-2.2*Math.sqrt(distance)*10/Math.sqrt(5)))} });return scores.sort((a,b)=>b.pct-a.pct)}
function render(){const game=document.getElementById('game'),notes=document.getElementById('notes');if(state.id==='end'){const ranked=similarities(),top=ranked[0];game.innerHTML=`<div class="eyebrow">왕의 생애 · 완료</div><h1>당신의 통치 기록</h1><p>총 ${state.choices}번의 결정을 내렸습니다.</p><div class="result"><b>가장 비슷한 왕: ${top.name}</b><p style="font-size:28px;margin:8px 0">${top.pct.toFixed(1)}%</p><span class="small">게임 설계상 유사도이며 역사적 일치 확률이 아닙니다.</span></div>${ranked.map(x=>`<p class="small">${x.name} · ${x.pct.toFixed(1)}%</p>`).join('')}<h2>판단 기준</h2><p class="small">민생·왕권·제도 개혁·학문·대외 관계 다섯 성향을 동일 가중치로 비교합니다. 각 선택의 변화값은 사전에 고정되어 있으며 최대 표시는 99.9%입니다.</p><details><summary>내가 선택한 모든 사건 보기</summary>${state.path.map((x,i)=>`<p class="small">${i+1}. ${esc(BY_ID[x.node].title)} — ${esc(x.text)}</p>`).join('')}</details><button class="restart" onclick="reset()">다시 태어나기</button>`;notes.innerHTML='<h2>역사적 사실과 게임</h2><p>사건의 기록은 실제 조선왕조실록 기사에서 가져왔습니다. 가상 왕자가 내린 대안과 그 결과는 역사적 사실이 아닙니다.</p>';return}
const n=BY_ID[state.id];if(!n){game.textContent='정의되지 않은 분기입니다.';return}const step=state.choices+1;game.innerHTML=`<div class="eyebrow">${n.year}년 · ${n.age}세 · 결정 ${step}</div><div class="bar"><div class="fill" style="width:${Math.min(100,step/16*100)}%"></div></div><h1>${esc(n.title)}</h1><p class="scene">${esc(n.body)}</p><div class="choices">${n.choices.map((c,i)=>`<button class="choice" onclick="choose(${i})">${esc(c.text)}<div class="sub">선택 ${i+1}</div></button>`).join('')}</div><p class="sub">실제 기록에 근거한 상황 · 선택은 가상 재구성</p>`;
notes.innerHTML=`<h2>실록 국역 기반 재서술</h2><p>${esc(n.proof)}</p><p class="source-state">${esc(n.sourceStatus)}</p><p class="source-state">게임의 선택지는 역사적 기록에 대한 가상 대안이며 실록 원문 발언이 아닙니다.</p><p><a href="${esc(n.source)}" target="_blank" rel="noopener noreferrer">조선왕조실록 국역·한문 원문 보기 ↗</a></p><h2 style="margin-top:24px">용어 풀이</h2>${Object.entries(n.gloss).map(([k,v])=>`<div class="term"><b>${esc(k)}</b><p>${esc(v)}</p></div>`).join('')}<div class="notice">플레이 중 성향 수치는 숨겨집니다. 왕과의 유사도는 마지막에 공개됩니다.</div>`}
reset();
</script></body></html>
